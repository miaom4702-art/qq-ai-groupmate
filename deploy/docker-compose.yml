name: qq-ai-bot

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    networks:
      - qqnet

  napcat:
    image: mlikiowa/napcat-docker:latest
    restart: unless-stopped
    environment:
      - MODE=ws
      - WEBUI_TOKEN=${NAPCAT_WEBUI_TOKEN}
      - ACCOUNT=${BOT_QQ}
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:16099:6099"
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data/napcat/config:/app/napcat/config
      - ./data/napcat/qq:/app/.config/QQ
    shm_size: "256mb"
    networks:
      - qqnet

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bot
    restart: unless-stopped
    env_file:
      - ../bot/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - LOCALSTORE_USE_CWD=true
      - TZ=Asia/Shanghai
      - 'ONEBOT_WS_URLS=["ws://napcat:3001"]'
      - AI_GROUPMATE__QDRANT_URI=http://qdrant:6333
    ports:
      - "18080:8080"
    volumes:
      - ./data/bot:/app/data
      - ./data/bot-config:/app/config
      - ./data/bot-cache:/app/cache
    depends_on:
      - napcat
      - qdrant
    networks:
      - qqnet

networks:
  qqnet:
